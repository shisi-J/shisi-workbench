        <button class="sidebar-close" id="sidebarClose" aria-label="关闭菜单">✕</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <!-- 独立功能 -->
        <div class="nav-section">
          <a href="#/" class="nav-item" data-route="/">
            <span class="nav-icon">🏠</span><span class="nav-label">首页概览</span>
          </a>
          <a href="#/podcast" class="nav-item" data-route="/podcast">
            <span class="nav-icon">🎙️</span><span class="nav-label">每日播客</span>
          </a>
        </div>

        <!-- 学习组（全展开） -->
        <div class="nav-section">
          <div class="nav-section-title"><span class="nav-icon">📚</span><span class="nav-label">学习组</span></div>
          <a href="#/learn/expression" class="nav-item sub" data-route="/learn/expression"><span class="nav-icon">📖</span><span class="nav-label">学习表达</span></a>
          <a href="#/learn/ai" class="nav-item sub" data-route="/learn/ai"><span class="nav-icon">🤖</span><span class="nav-label">学习AI</span></a>
          <a href="#/learn/english" class="nav-item sub" data-route="/learn/english"><span class="nav-icon">🔤</span><span class="nav-label">学习英语</span></a>
          <a href="#/learn/media" class="nav-item sub" data-route="/learn/media"><span class="nav-icon">📱</span><span class="nav-label">学习新媒体</span></a>
          <a href="#/learn/office" class="nav-item sub" data-route="/learn/office"><span class="nav-icon">💼</span><span class="nav-label">Office技巧</span></a>
        </div>

        <!-- 日常生活（全展开） -->
        <div class="nav-section">
          <div class="nav-section-title"><span class="nav-icon">🌱</span><span class="nav-label">日常生活</span></div>
          <a href="#/life/eat" class="nav-item sub" data-route="/life/eat"><span class="nav-icon">🍽️</span><span class="nav-label">吃 · 美食探店</span></a>
          <a href="#/life/fitness" class="nav-item sub" data-route="/life/fitness"><span class="nav-icon">💪</span><span class="nav-label">健身 · 训练台账</span></a>
          <a href="#/life/beauty" class="nav-item sub" data-route="/life/beauty"><span class="nav-icon">💄</span><span class="nav-label">美丽 · 美妆穿搭</span></a>
          <a href="#/life/travel" class="nav-item sub" data-route="/life/travel"><span class="nav-icon">✈️</span><span class="nav-label">旅游 · 行程游记</span></a>
          <a href="#/life/home" class="nav-item sub" data-route="/life/home"><span class="nav-icon">🏠</span><span class="nav-label">小屋 · 安家置业</span></a>
          <a href="#/life/social" class="nav-item sub" data-route="/life/social"><span class="nav-icon">🤝</span><span class="nav-label">社交 · 人情往来</span></a>
        </div>

        <!-- 工作随笔记（全展开） -->
        <div class="nav-section">
          <div class="nav-section-title"><span class="nav-icon">💼</span><span class="nav-label">工作随笔记</span></div>
          <a href="#/work/project" class="nav-item sub" data-route="/work/project"><span class="nav-icon">📊</span><span class="nav-label">项目管理</span></a>
          <a href="#/work/procurement" class="nav-item sub" data-route="/work/procurement"><span class="nav-icon">📦</span><span class="nav-label">采销管理</span></a>
          <a href="#/work/finance" class="nav-item sub" data-route="/work/finance"><span class="nav-icon">💰</span><span class="nav-label">财务收付款</span></a>
          <a href="#/work/hr" class="nav-item sub" data-route="/work/hr"><span class="nav-icon">👥</span><span class="nav-label">人资社保</span></a>
          <a href="#/work/info" class="nav-item sub" data-route="/work/info"><span class="nav-icon">📋</span><span class="nav-label">信息台账</span></a>
        </div>

        <!-- 其他独立模块 -->
        <div class="nav-section">
          <a href="#/knowledge" class="nav-item" data-route="/knowledge">
            <span class="nav-icon">📁</span><span class="nav-label">个人知识库</span>
          </a>
          <a href="#/workflow" class="nav-item" data-route="/workflow">
            <span class="nav-icon">📋</span><span class="nav-label">工作流</span>
          </a>
        </div>
      </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content" id="mainContent">
      <!-- 顶部工具栏 -->
      <header class="topbar" id="topbar">
        <button class="topbar-menu" id="menuToggle" aria-label="打开菜单">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-title-center" id="topbarHome" role="button" tabindex="0">诗思</div>
        <div class="topbar-actions">
          <button class="topbar-btn" id="searchBtn" aria-label="搜索">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <button class="topbar-btn" id="settingsBtn" aria-label="设置">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </header>

      <!-- 搜索浮层 -->
      <div class="search-overlay" id="searchOverlay">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜你想看的..." autocomplete="off">
          <button id="searchClose" class="search-close">取消</button>
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>

      <!-- AI对话浮层 -->
      <div class="ai-panel" id="aiPanel">
        <div class="ai-header">
          <span class="ai-title">⚡ 快速记录</span>
          <button id="aiClose" class="ai-close">✕</button>
        </div>
        <!-- Tab切换 -->
        <div class="ai-tabs">
          <div class="ai-tab active" data-aitab="chat">💬 AI对话</div>
          <div class="ai-tab" data-aitab="collect">📥 收藏链接</div>
        </div>
        <!-- AI对话面板 -->
        <div class="ai-tab-content active" id="aiChatContent">
          <div class="ai-messages" id="aiMessages">
            <div class="ai-msg bot">你好，我是诗思AI助手，有什么可以帮你的？</div>
          </div>
          <div class="ai-input-area">
            <input type="text" id="aiInput" placeholder="输入消息..." autocomplete="off">
            <button id="aiSend" class="ai-send">发送</button>
          </div>
        </div>
        <!-- 收藏链接面板 -->
        <div class="ai-tab-content" id="aiCollectContent" style="display:none;">
          <div class="ai-collect-body">
            <textarea class="ai-collect-input" id="collectInput" placeholder="粘贴抖音/小红书/B站分享口令或链接..." rows="3"></textarea>
            <button class="btn btn-secondary btn-sm" id="collectPasteBtn" style="margin-top:6px;">📋 读取剪贴板</button>
            <div id="collectParseResult" style="margin-top:8px;"></div>
            <div id="collectActions" style="display:none; margin-top:8px;">
              <button class="btn btn-primary btn-block" id="collectSaveBtn">📥 收藏到灵感库</button>
            </div>
            <div class="ai-collect-recent">
              <div class="ai-collect-recent-header">📋 最近收藏</div>
              <div id="collectRecentList" class="ai-collect-recent-list"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 页面内容（路由出口） -->
      <div class="page-container" id="pageContainer">
        <div class="loading-screen">
          <div class="loading-spinner"></div>
          <p>加载中...</p>
        </div>
      </div>
      <!-- AI浮动按钮 -->
      <button class="ai-fab" id="aiFab" aria-label="AI助手">🤖</button>

      <!-- 底部快捷导航栏 -->
      <nav class="bottom-nav" id="bottomNav">
        <a href="#/todo" class="bottom-nav-item" data-route="/todo">
          <span class="bottom-nav-icon">✅</span>
          <span class="bottom-nav-label">待办</span>
        </a>
        <a href="#/insight" class="bottom-nav-item" data-route="/insight">
          <span class="bottom-nav-icon">🧠</span>
          <span class="bottom-nav-label">感悟</span>
        </a>
        <a href="#/inspiration" class="bottom-nav-item" data-route="/inspiration">
          <span class="bottom-nav-icon">💡</span>
          <span class="bottom-nav-label">灵感</span>
        </a>
        <a href="#/energy" class="bottom-nav-item" data-route="/energy">
          <span class="bottom-nav-icon">⚡</span>
          <span class="bottom-nav-label">能量</span>
        </a>
      </nav>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- 应用代码 -->
  <script type="module" src="js/app.js?v=167"></script>
</body>
